<!DOCTYPE html>
<html>
<head>
    <title>ES6 JavaScript</title>
</head>

<body>

    <h1>ES6 JavaScript Examples</h1>

    <script>

        // Arrow Function
        const add = (a, b) => a + b;

        // Object
        let student = {
            name: "Palak",
            age: 20,
            course: "BSc CS"
        };

        // Object Destructuring
        let { name, age, course } = student;

        // Template Literal and String Interpolation
        console.log(`Name: ${name}`);
        console.log(`Age: ${age}`);
        console.log(`Course: ${course}`);

        // Display on webpage
        document.write(`<h2>Student Details</h2>`);
        document.write(`Name: ${name}<br>`);
        document.write(`Age: ${age}<br>`);
        document.write(`Course: ${course}<br><br>`);

        // Arrow Function
        document.write(`Addition: ${add(10, 20)}<br>`);

        // Array Destructuring
        let marks = [80, 85, 90];

        let [maths, science, computer] = marks;

        document.write(`Maths: ${maths}<br>`);
        document.write(`Science: ${science}<br>`);
        document.write(`Computer: ${computer}<br><br>`);

        // Default Parameter
        function greet(name = "Guest") {
            return `Hello ${name}`;
        }

        document.write(greet("Palak") + "<br>");
        document.write(greet() + "<br><br>");

        // Spread Operator
        let numbers1 = [10, 20, 30];
        let numbers2 = [40, 50, 60];

        let numbers = [...numbers1, ...numbers2];

        document.write(`Spread Array: ${numbers}<br><br>`);

        // Rest Operator
        function total(...values) {
            return values.reduce((sum, value) => sum + value, 0);
        }

        document.write(`Rest Operator Total: ${total(10, 20, 30, 40)}`);

    </script>

</body>
</html>
