<!DOCTYPE html>
<html>
<body>
<script>
let login =
new Promise((resolve,reject)=>{
let success = true;
if(success)
{
 resolve("Login Successful");
}
else
{
 reject("Login Failed");
}
});
login
.then(result =>
document.write(result))
.catch(error =>
document.write(error));
</script>
</body>
</html>
