<!DOCTYPE html >
<html>
<head> 
<title>DOM Example</title>
</head>
<body>
<p class="text">First Paragraph</p>
<p class="text">Second Paragraph</p>
<script>
const elements = document.getElementsByClassName("text");
elements[0].style.color = "red";
elements[1].style.color = "black";
</script>
</body>
</html>
